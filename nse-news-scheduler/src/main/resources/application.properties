# Server
server.port=8084

# Database
# Credentials are read from environment variables.
# For local dev, set DB_USERNAME and DB_PASSWORD in your OS environment or .env file.
# Fallback defaults (postgres/postgres) are only for local development convenience.
spring.datasource.url=jdbc:postgresql://localhost:5432/watchlisttracker
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA — Hibernate creates the table on first startup if it doesn't exist.
# No Flyway — same approach as auth-service and user-service.
# Reference SQL: scripts/create_company_news_table.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Scheduler timezone — all @Scheduled cron expressions are evaluated in this timezone.
# Production server (AWS EC2) runs UTC by default; this ensures cron hours mean IST.
scheduler.timezone=Asia/Kolkata

# NSE Scheduler — every 15 minutes
news.nse.cron=0 */15 * * * ?

# Google RSS Scheduler — every 15 minutes, all day, every day (domestic + US + global keywords
# are all merged into keywords.txt and fetched together on this single cadence).
news.google.cron=0 */15 * * * ?

# Delay between Google RSS requests in milliseconds
# Prevents Google from rate limiting us
news.google.fetch.delay.ms=500

# How many items to fetch from Google RSS per keyword per run.
# Fetching 10 per 15-min cycle captures all new articles before they scroll off the feed.
news.rss.fetch-limit=10

# News retention policy — sliding window with a minimum floor.
# Applies to SECTOR and MACRO (keywords.txt) keywords. Company symbols use the company-specific
# dual-retention policy below instead.
# window-hours: articles older than this many hours are eligible for removal during cleanup
# min-count: if fewer than this many fresh articles exist for a keyword after the window filter,
#            the newest older articles are kept as a floor so the frontend always has content
news.retention.window-hours=24
news.retention.min-count=15

# Company-specific retention — how long company news is KEPT in the database.
# Applies ONLY to company-symbol keywords (from global_watchlist); sectors/macro are unaffected.
#
# Both windows are one quarter because the Sentiments tab averages over lookbacks up to 90 days,
# and a window can only be as long as the history behind it. At the previous 7-day setting the
# "last 1 quarter" figure would have been a 7-day average wearing a longer label.
#
# Cost of the widening, measured rather than assumed: the JSONB grows roughly an order of
# magnitude (~3 KB to ~25 KB per company), which is tens of megabytes in total — Postgres does not
# notice. The real costs are write amplification, since every save rewrites the whole blob, and
# deduplication, since SimilarityChecker compares each incoming headline against every stored one.
# Both scale with articles per company, and both were acceptable at this volume.
news.retention.company.latest-window-days=90
news.retention.company.important-window-days=90

# Company display windows — what each TAB shows. Deliberately separate from the retention
# settings above, which say only how long articles are kept.
#
# These were one and the same property while both meant 7 days. Widening retention to a quarter
# without splitting them would have silently turned the Latest News tab into a three-month
# archive: the tab filters on this value, and it had been reading the retention one.
news.display.company.latest-window-days=7
news.display.company.important-window-days=90

# News cleanup scheduler — runs every hour at the top of the hour
news.cleanup.cron=0 0 * * * *

# NSE and RSS API base URLs — externalized so they can be overridden per environment
# without touching code or recompiling
news.nse.url=https://www.nseindia.com/api/corporate-announcements?index=equities
news.rss.base-url=https://news.google.com/rss/search?hl=en-IN&gl=IN&ceid=IN:en&q=

# Dedup sliding window sizes — externalized to allow tuning without redeploy
# seqid window: must cover at least one full NSE batch (NSE returns ~20 items per call)
# url window: covers recent Google RSS articles to avoid re-fetching on restarts
news.seqid.window-size=20
news.url.window-size=500

# Google RSS thread pool size — standardized to kebab-case
news.google.thread-pool-size=2

# Spring scheduler thread pool size — default is 1, which causes @Scheduled methods to queue behind
# long-running fetches. With 5 threads, US market and main fetch can run concurrently.
spring.task.scheduling.pool.size=5

# Resilience4j — Retry for NSE fetch
# max-attempts=3: tries the HTTP call up to 3 times before giving up
# wait-duration=1s: waits 1 second between each retry attempt
# ignore-exceptions: InterruptedException means the thread was killed — do not retry
resilience4j.retry.instances.nse-fetch.max-attempts=3
resilience4j.retry.instances.nse-fetch.wait-duration=1s
resilience4j.retry.instances.nse-fetch.ignore-exceptions=java.lang.InterruptedException

# Resilience4j — Retry for Google RSS fetch
resilience4j.retry.instances.rss-fetch.max-attempts=3
resilience4j.retry.instances.rss-fetch.wait-duration=1s
resilience4j.retry.instances.rss-fetch.ignore-exceptions=java.lang.InterruptedException

# Resilience4j — Circuit Breaker for NSE fetch
# sliding-window-size=5: evaluates failure rate across the last 5 calls
# failure-rate-threshold=60: opens circuit if 60%+ of the last 5 calls failed (i.e., 3/5)
# wait-duration-in-open-state=60s: circuit stays open for 60s before trying again (half-open)
resilience4j.circuitbreaker.instances.nse-fetch.sliding-window-size=5
resilience4j.circuitbreaker.instances.nse-fetch.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.nse-fetch.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.nse-fetch.permitted-number-of-calls-in-half-open-state=2

# Resilience4j — Circuit Breaker for Google RSS fetch
resilience4j.circuitbreaker.instances.rss-fetch.sliding-window-size=5
resilience4j.circuitbreaker.instances.rss-fetch.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.rss-fetch.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.rss-fetch.permitted-number-of-calls-in-half-open-state=2

# Spring Actuator — exposes health and metrics endpoints for production monitoring
# /actuator/health: used by Kubernetes liveness/readiness probes
# /actuator/metrics: exposes JVM, thread, memory, and custom metrics
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# HTTP Client timeouts (applied to all outbound HTTP calls — NSE and Google RSS)
# connect-timeout: max time to establish a TCP connection to the remote server
# request-timeout: max time to wait for a full HTTP response after connection is open
# Both prevent threads from hanging indefinitely on slow or unresponsive external APIs
news.http.connect-timeout-seconds=5
news.http.request-timeout-seconds=10

# Logging configuration — uses Log4j2 (logback-spring.xml replaced by log4j2-spring.xml)
logging.config=classpath:log4j2-spring.xml

# ───── Sentiment analysis (ProsusAI FinBERT, INT8 ONNX, in-JVM CPU inference) ─────
# Headlines are scored once at SAVE time and the score is stored inside the news JSONB
# array. Read endpoints only average stored numbers — they never run the model — because
# the watchlist and index/sector tables render dozens of companies per page view.
#
# enabled: kill-switch. When false the model is never loaded (no memory cost) and news
#          continues to be fetched and served exactly as before.
sentiment.enabled=${SENTIMENT_ENABLED:true}

# Directory holding sentiment-model.onnx, tokenizer.json and config.json.
# Deployed alongside the jar rather than bundled inside it: the artefact is ~110 MB and
# changes at most a couple of times a year, so packaging it would slow every build.
sentiment.model.path=${SENTIMENT_MODEL_PATH:models}

# Token cap per headline. Headlines run ~32-64 tokens, so 64 truncates nothing in practice
# while keeping the attention working set 4x smaller than 128 would.
sentiment.model.max-length=64

# NOTE — two settings were removed here, deliberately.
#
#   sentiment.current.top-n        (was 5)
#   sentiment.current.max-age-days (was 30)
#
# Both belonged to the old "current" reading: the mean of the newest N scored headlines at any age.
# That average needed an expiry rule, because nothing rewrites a quiet company's score and it would
# otherwise have read as current indefinitely.
#
# The badge now shows the LATEST article instead — one headline, not an average. It needs no expiry
# because it makes no claim to be current: it says what the last piece of news said, which stays
# true however long ago it was. The protection the cut-off provided (never letting stale data pass
# as fresh) is now met by carrying the article's date through to the UI, which is strictly more
# informative than suppressing the value.
#
# The period rows on the Sentiments tab are self-expiring by construction: "Today" is a calendar
# day, so it empties on its own at midnight.
#
# The 90-day aggregate length is NOT configured here. It is read from SentimentWindow.QUARTER_1 so
# the table column and the tab row cannot drift apart.

# Per-company cap on headlines scored by one backfill pass; 0 means score everything.
# Capping shortens a first run at the cost of leaving older articles unscored, which biases the
# longer sentiment windows — they would be missing exactly the articles that only they cover.
sentiment.backfill.max-per-keyword=0

# Score bands for the -5.0..+5.0 scale. Tunable without a rebuild because the right cut-off
# depends on how the model behaves on our own headlines.
sentiment.threshold.positive=1.5
sentiment.threshold.negative=-1.5

# ONNX Runtime tuning for a 2 GB t3.small already running several Spring contexts.
# NOTE: ONNX allocates in NATIVE memory, outside -Xmx. Size the instance on total RSS.
#   threads=1        : t3.small has 2 vCPU shared with the schedulers; extra inference
#                      threads cost memory and oversubscribe the box for little latency gain.
#   cpu-arena=false  : the arena pre-allocates generously and never returns memory to the OS.
#                      Correct for a high-throughput server, pure waste for a job that scores
#                      a few hundred headlines then idles for 15 minutes.
#   memory-pattern=false : pattern planning assumes fixed shapes; headlines vary in length.
sentiment.onnx.intra-op-threads=1
sentiment.onnx.inter-op-threads=1
sentiment.onnx.cpu-arena-enabled=false
sentiment.onnx.memory-pattern-enabled=false
