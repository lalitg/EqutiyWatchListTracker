# Server port
server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/watchlisttracker
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA — set to none because Flyway handles table creation
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway — enabled by default when dependency is present, but let's be explicit
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Flyway — tells Flyway the DB already has tables from other services
# baseline means: "mark the existing state as version 0, then run my V1 script"
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# NSE Scheduler — every 15 minutes
news.nse.cron=0 */15 * * * ?

# News limit per keyword
news.limit=5
