spring.application.name=nse-news-scheduler
 
# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/watchlisttracker
spring.datasource.username=postgres
spring.datasource.password=lalitgera
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
 
# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
 
# ── Server ────────────────────────────────────────────────────
server.port=8084
 
# ── Scheduler Times ───────────────────────────────────────────
# Main fetch job: 8:00 AM every day
news.scheduler.cron=0 0 8 * * *
# Archive job: midnight every day (archives expired events + old news)
archive.scheduler.cron=0 0 0 * * *
 
# ── NSE API URLs ──────────────────────────────────────────────
nse.api.event-calendar=https://www.nseindia.com/api/event-calendar?index=equities
nse.api.announcements=https://www.nseindia.com/api/corporate-announcements?index=equities
nse.api.connect-timeout=10000
nse.api.read-timeout=30000
 
# ── News Limits ───────────────────────────────────────────────
# Default: keep 5 latest news items per company
news.limit.default=5
# Big companies get 15 items
news.limit.big=15
# Comma-separated list of big-company symbols (add/remove as needed)
news.limit.big-companies=RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,HDFC,WIPRO,SBIN,BAJFINANCE,LT,AXISBANK,SUNPHARMA,DREDDY,CIPLA,MARUTI,TATAMOTORS,BAJAJ-AUTO,HINDUNILVR,ITC,NESTLEIND,ADANIENT,SBICARD,INDIGO
# These symbols cover all sectors for a complete demo.
# Replace this entire list later with the DB approach (see Section 3).
news.tracked-symbols=RELIANCE,TCS,INFY,WIPRO,HDFCBANK,ICICIBANK,SBIN,AXISBANK,SUNPHARMA,DRREDDY,CIPLA,MARUTI,TATAMOTORS,BAJAJ-AUTO,HINDUNILVR,ITC,NESTLEIND,LT,BAJFINANCE,ADANIENT,BRITANNIA,STALLION,MEDANTA,ULTRACEMCO,ONGC,DRCSYSTEMS,SBICARD,INDIGO
 
# ── Sectors to track (domestic) ───────────────────────────────
# These become SECTOR_IT, SECTOR_PHARMA etc. in company_symbol column
news.sectors=IT,PHARMA,BANKING,AUTO,FMCG
 
# ── Google RSS search queries per sector ──────────────────────
news.sector.query.IT=Indian IT sector stocks
news.sector.query.PHARMA=Indian pharma sector stocks
news.sector.query.BANKING=Indian banking sector stocks
news.sector.query.AUTO=Indian auto sector stocks NSE
news.sector.query.FMCG=Indian FMCG sector stocks NSE
 
# ── Global regions ────────────────────────────────────────────
news.global.regions=US,EUROPE,ASIA
news.global.query.US=US stock market news today
news.global.query.EUROPE=Europe stock market news today
news.global.query.ASIA=Asia stock market news today
