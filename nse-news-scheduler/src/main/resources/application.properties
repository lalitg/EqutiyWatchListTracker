# Server
server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/watchlisttracker
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# NSE Scheduler — every 15 minutes
news.nse.cron=0 */15 * * * ?

# Google RSS Scheduler — every day at 8 AM
news.google.cron=0 0 0,8,10,12,14,16,20 * * ?

# Google RSS thread pool — 2 worker threads
# Increase to 5 after stability confirmed
news.google.thread.pool.size=2

# Delay between Google RSS requests in milliseconds
# Prevents Google from rate limiting us
news.google.fetch.delay.ms=500

# News items to keep per keyword
news.limit=5

# Logging configuration
logging.config=classpath:logback-spring.xml
