# ============================================================
# nse-code-service (nse-enterprise-scheduler) config — used ONLY
# in unified-scheduler. Loaded via spring.config.name=application-nse-code.
# ============================================================

spring.application.name=nse-code-service
server.port=8086

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway — MUST be disabled. Same reason as application-global-watchlist:
# nse-events/nse-news JARs bring Flyway onto the shared classpath and Spring Boot
# would autoconfigure it here too, conflicting on flyway_schema_history and
# aborting this context before company_master / sector_companies are created.
spring.flyway.enabled=false

# JPA / Hibernate — Hibernate owns schema for this service (no Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Scheduling thread pool
spring.task.scheduling.pool.size=2

# Logging — unified log4j2-spring.xml in unified-scheduler resources
logging.config=classpath:log4j2-spring.xml
