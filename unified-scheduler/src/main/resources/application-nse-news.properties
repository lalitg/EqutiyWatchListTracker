# ============================================================
# nse-news-scheduler config — unified-scheduler context.
# Loaded via --spring.config.name=application-nse-news
# ============================================================

spring.application.name=nse-news-scheduler
server.port=8084

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled — ddl-auto=update handles schema, avoids classpath migration conflicts
spring.flyway.enabled=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Scheduler timezone — all @Scheduled cron expressions are evaluated in this timezone
scheduler.timezone=Asia/Kolkata

# NSE Scheduler — every 15 minutes
news.nse.cron=0 */15 * * * ?

# Google RSS Scheduler — every 15 minutes, all day, every day (domestic + US + global keywords
# are all merged into keywords.txt and fetched together on this single cadence).
news.google.cron=0 */15 * * * ?

# Delay between Google RSS requests in milliseconds
news.google.fetch.delay.ms=500

# News retention policy — 24-hour sliding window with a minimum floor.
# Applies to SECTOR and MACRO (keywords.txt) keywords.
news.retention.window-hours=24
news.retention.min-count=15

# Company-specific retention — how long company news is KEPT in the database.
# Applies ONLY to company-symbol keywords (from global_watchlist); sectors/macro are unaffected.
#
# Both windows are one quarter because the Sentiments tab averages over lookbacks up to 90 days,
# and a window can only be as long as the history behind it. This was 7 days; leaving it there
# would have made every sentiment period longer than a week silently report a 7-day average.
news.retention.company.latest-window-days=90
news.retention.company.important-window-days=90

# Company DISPLAY windows — what each TAB shows. Deliberately separate from retention above,
# which says only how long articles are kept. These were one and the same property while both
# meant 7 days; widening retention to a quarter without splitting them would have turned the
# Latest News tab into a three-month archive.
news.display.company.latest-window-days=7
news.display.company.important-window-days=90

# News cleanup scheduler — runs every hour at the top of the hour
news.cleanup.cron=0 0 * * * *

# Spring scheduler thread pool — needs 5 threads so concurrent @Scheduled methods don't block each other
spring.task.scheduling.pool.size=5

# How many items to fetch from Google RSS per keyword
news.rss.fetch-limit=10

# NSE and RSS API base URLs
news.nse.url=https://www.nseindia.com/api/corporate-announcements?index=equities
news.rss.base-url=https://news.google.com/rss/search?hl=en-IN&gl=IN&ceid=IN:en&q=

# Dedup sliding window sizes
news.seqid.window-size=20
news.url.window-size=500

# Google RSS thread pool size
news.google.thread-pool-size=2

# Resilience4j — Retry for NSE fetch
resilience4j.retry.instances.nse-fetch.max-attempts=3
resilience4j.retry.instances.nse-fetch.wait-duration=1s
resilience4j.retry.instances.nse-fetch.ignore-exceptions=java.lang.InterruptedException

# Resilience4j — Retry for Google RSS fetch
resilience4j.retry.instances.rss-fetch.max-attempts=3
resilience4j.retry.instances.rss-fetch.wait-duration=1s
resilience4j.retry.instances.rss-fetch.ignore-exceptions=java.lang.InterruptedException

# Resilience4j — Circuit Breaker for NSE fetch
resilience4j.circuitbreaker.instances.nse-fetch.sliding-window-size=5
resilience4j.circuitbreaker.instances.nse-fetch.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.nse-fetch.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.nse-fetch.permitted-number-of-calls-in-half-open-state=2

# Resilience4j — Circuit Breaker for Google RSS fetch
resilience4j.circuitbreaker.instances.rss-fetch.sliding-window-size=5
resilience4j.circuitbreaker.instances.rss-fetch.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.rss-fetch.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.rss-fetch.permitted-number-of-calls-in-half-open-state=2

# Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# HTTP Client timeouts
news.http.connect-timeout-seconds=5
news.http.request-timeout-seconds=10

# Logging — unified log4j2-spring.xml
logging.config=classpath:log4j2-spring.xml

# ═══════════════════════════════════════════════════════════════════════════════
#  Sentiment (FinBERT via ONNX Runtime, in-process)
#
#  Mirrors nse-news-scheduler/src/main/resources/application.properties. Kept here
#  because the unified launcher pins spring.config.name=application-nse-news, so the
#  service's own application.properties is never read and every value it relies on
#  has to be restated.
# ═══════════════════════════════════════════════════════════════════════════════
sentiment.enabled=${SENTIMENT_ENABLED:true}

# Path to the exported model directory (sentiment-model.onnx, tokenizer.json, config.json).
#
# RELATIVE PATHS RESOLVE AGAINST THE JVM WORKING DIRECTORY. In this JVM that is wherever
# unified-scheduler was launched from, NOT the nse-news module. Launching from elsewhere makes
# the model silently unfindable: scoring disables itself with a single WARN, news keeps flowing,
# and every article is stored permanently unscored. Set SENTIMENT_MODEL_PATH to an ABSOLUTE path
# in any deployed environment, and verify with /api/internal/sentiment/status after start-up.
sentiment.model.path=${SENTIMENT_MODEL_PATH:models}

sentiment.model.max-length=64

# Score bands for the -5.0..+5.0 scale.
sentiment.threshold.positive=1.5
sentiment.threshold.negative=-1.5

# Extremes page — board size and how many single-day tabs are offered.
# No minimum article count: every row carries its article count and ties break on it instead.
sentiment.extremes.board-size=10
sentiment.extremes.day-count=7

# Per-company cap on headlines scored by one backfill pass; 0 means score everything.
sentiment.backfill.max-per-keyword=0

# ONNX Runtime tuning.
#
# NOTE: ONNX allocates in NATIVE memory, outside -Xmx. In the unified JVM this sits alongside five
# other Spring contexts, so total RSS — not heap — is what sizes the instance. Single-threaded with
# the arena allocator disabled keeps the footprint near the model size instead of letting a
# high-throughput allocator hold memory it never returns.
sentiment.onnx.intra-op-threads=1
sentiment.onnx.inter-op-threads=1
sentiment.onnx.cpu-arena-enabled=false
sentiment.onnx.memory-pattern-enabled=false
