# ============================================================
# fast-movers-service config — unified-scheduler context.
# Loaded via --spring.config.name=application-fast-movers
# ============================================================

spring.application.name=fast-movers-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled — ddl-auto=update handles schema, avoids classpath migration conflicts
spring.flyway.enabled=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Scheduling thread pool
spring.task.scheduling.pool.size=2

# Logging — unified log4j2-spring.xml
logging.config=classpath:log4j2-spring.xml
