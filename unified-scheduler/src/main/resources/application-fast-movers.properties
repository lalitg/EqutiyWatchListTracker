# ============================================================
# fast-movers-service config — used ONLY in unified-scheduler.
# Each service in the unified JVM loads a named properties file
# (spring.config.name=application-fast-movers) so that the
# 5 services' configs do not collide on the shared classpath.
# The standalone service still uses its own application.properties.
# ============================================================

spring.application.name=fast-movers-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway — MUST be disabled. nse-events and nse-news JARs bring Flyway onto
# the shared classpath and Spring Boot would autoconfigure it here too,
# finding two competing V1 migration scripts and aborting this context.
spring.flyway.enabled=false

# JPA / Hibernate — Hibernate owns schema for this service (no Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Scheduling thread pool
spring.task.scheduling.pool.size=2

# Logging — unified log4j2-spring.xml in unified-scheduler resources
logging.config=classpath:log4j2-spring.xml
