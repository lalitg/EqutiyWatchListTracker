# ============================================================
# global-watchlist-service config — unified-scheduler context.
# Loaded via --spring.config.name=application-global-watchlist
# ============================================================

spring.application.name=global-watchlist-service
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP — conservative pool for t3.micro (6 contexts share the JVM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway must be disabled — Flyway on shared classpath would run nse-news migrations
# against this context's schema history and abort startup
spring.flyway.enabled=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# yfinance wrapper for global indices — dedicated instance on port 5002
# (separate process from fundamentals-service's own wrapper on 5001 — see
# yfinance-global.service / yfinance-fundamentals.service on the EC2 host)
# Same change as fundamentals: the persistent Flask server on port 5002 is gone, replaced by an
# on-demand subprocess that exits when the fetch completes.
#
# The script path is RELATIVE TO THE JVM WORKING DIRECTORY — wherever unified-scheduler was
# launched from, not this service's module. Override with an absolute path when deployed.
python.executable=${PYTHON_EXECUTABLE:python}
python.global-indices.script=${PYTHON_GLOBAL_SCRIPT:global-watchlist-service/yfinance_wrapper.py}
python.process.timeout-seconds=${PYTHON_PROCESS_TIMEOUT_SECONDS:60}

# Logging — unified log4j2-spring.xml
logging.config=classpath:log4j2-spring.xml
