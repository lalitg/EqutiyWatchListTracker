# ============================================================
# global-watchlist-service config — used ONLY in unified-scheduler.
# Each service in the unified JVM loads a named properties file
# (spring.config.name=application-global-watchlist) so that the
# 4 services' configs do not collide on the shared classpath.
# The standalone service still uses its own application.properties.
# ============================================================

spring.application.name=global-watchlist-service
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway — MUST be disabled for this service in the unified JAR.
# Flyway is on the shared classpath (pulled in by nse-events and nse-news JARs).
# Without this flag Spring Boot autoconfigures Flyway for EVERY context,
# including this one. It then finds nse-news's migration scripts at
# classpath:db/migration and tries to run them against flyway_schema_history
# (already owned by nse-news), causing a conflict that aborts context startup
# before Hibernate ever runs — which is why global_watchlist is never created.
spring.flyway.enabled=false

# JPA / Hibernate — Hibernate owns schema for this service (no Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging — unified log4j2-spring.xml in unified-scheduler resources
logging.config=classpath:log4j2-spring.xml
