# ============================================================
# nse-events-scheduler config — unified-scheduler context.
# Loaded via --spring.config.name=application-nse-events
# ============================================================

spring.application.name=nse-events-scheduler
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disabled — ddl-auto=update handles schema, avoids classpath migration conflicts
spring.flyway.enabled=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# NSE Events Scheduler — every 20 minutes
events.nse.cron=0 */20 * * * ?

# HTTP read timeout for NSE API calls (seconds)
events.nse.timeout.seconds=10

# Events to keep per company
events.limit=10

# Logging — unified log4j2-spring.xml
logging.config=classpath:log4j2-spring.xml
