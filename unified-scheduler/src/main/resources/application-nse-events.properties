# ============================================================
# nse-events-scheduler config — used ONLY in unified-scheduler.
# Loaded via spring.config.name=application-nse-events.
# ============================================================

spring.application.name=nse-events-scheduler
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA — Flyway handles schema; Hibernate does nothing to it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway — uses its own history table to avoid collision with other services
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_events
spring.flyway.locations=classpath:db/migration-events
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.repair-on-migrate=true

# NSE Events Scheduler cron — 7 AM daily
events.nse.cron=0 0 7 * * ?

# HTTP read timeout for NSE API calls (seconds)
events.nse.timeout.seconds=10

# Events to keep per company
events.limit=10

# Logging — unified log4j2-spring.xml in unified-scheduler resources
logging.config=classpath:log4j2-spring.xml
