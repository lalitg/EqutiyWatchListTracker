# ============================================================
# sebi-data-service config — unified-scheduler context.
# Loaded via --spring.config.name=application-sebi-data
# ============================================================

spring.application.name=sebi-data-service
server.port=8089

# NSE equity list — fetched once at startup to build company name→symbol map
nse.equity.csv.url=https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv

# SEBI endpoints
sebi.rss.url=https://www.sebi.gov.in/sebirss.xml
sebi.buybacks.url=https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&ssid=22&smid=17

# HTTP timeouts (ms)
http.connect.timeout=10000
http.read.timeout=20000

# ───── AMFI Monthly Downloads ─────────────────────────────────────────────────
# AMFI Monthly Note listing page (PDF). Filenames aren't predictable (random hex suffix,
# inconsistent month formatting) so this source is scraped and matched by target month.
amfi.monthlynote.url=https://www.amfiindia.com/otherdata/amfi-monthlynote

# AMFI Monthly report (Excel). Base URL only — the filename pattern is fully predictable
# (am{3-letter-month}{4-digit-year}repo.xls), constructed directly, no scraping needed.
amfi.monthly-report.base-url=https://portal.amfiindia.com/spages

# Local directory where downloaded AMFI documents are saved (created automatically if missing).
amfi.download.dir=./downloads/amfi

# sebi-data-service has no database. However, other service JARs on the shared classpath
# (nse-news, fundamentals, etc.) bring in spring-boot-starter-data-jpa and the PostgreSQL
# driver, which Spring Boot's auto-configuration picks up and tries to configure a DataSource
# for this context too — failing with "Failed to determine a suitable driver class".
# Excluding these auto-configurations prevents that from happening.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Scheduling thread pool — keep small to share RAM with other 5 contexts
spring.task.scheduling.pool.size=2

# Logging — unified log4j2-spring.xml wins (set by UnifiedSchedulerApplication
# before any context starts); this line is a no-op in the unified JVM but
# is kept for clarity and standalone-mode compatibility.
logging.config=classpath:log4j2-spring.xml
