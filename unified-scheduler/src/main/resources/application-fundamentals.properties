# ============================================================
# fundamentals-service config — used ONLY in unified-scheduler.
# Loaded via spring.config.name=application-fundamentals.
# The standalone service still uses its own application.properties.
# ============================================================

spring.application.name=fundamentals-service
server.port=8086

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP — conservative pool; t3.micro has 1 GB shared across 6 contexts
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway — MUST be disabled. nse-events and nse-news JARs bring Flyway onto
# the shared classpath; without this flag Spring Boot autoconfigures it for
# this context too, conflicting on flyway_schema_history and aborting startup.
# Hibernate owns the schema for this service instead.
spring.flyway.enabled=false

# JPA / Hibernate — creates tables on first startup if they don't exist
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# yfinance Python wrapper — must be running before the scheduler fetches.
# Start with: python yfinance_wrapper.py  (runs on port 5001 by default)
fundamentals.yfinance.base-url=${YFINANCE_BASE_URL:http://localhost:5001}

# Scheduler cron expressions
# Nightly quarterly fetch — 11 PM every day (season-gated inside the job)
fundamentals.quarterly.cron=0 0 23 * * *
# Weekly off-season sync — every Sunday at 2 AM
fundamentals.weekly-sync.cron=0 0 2 * * SUN
# Monthly balance sheet fetch — 1st of every month at 3 AM
fundamentals.balance-sheet.cron=0 0 3 1 * *
# Daily P/E snapshot — Mon–Fri at 4:30 PM IST (1 h after NSE closes)
fundamentals.pe-snapshot.cron=0 30 16 * * MON-FRI
# New-company detection poll — fixedDelay 5 min (waits after prev run finishes)
fundamentals.new-company-poll.delay-ms=300000

# Rate limiter — sleep between companies to avoid yfinance HTTP 429
# 1500 ms x companies in global_watchlist per full run
fundamentals.rate-limit.delay-ms=1500

# Scheduling thread pool — keep small to share RAM with other 5 contexts
spring.task.scheduling.pool.size=2

# Logging — unified log4j2-spring.xml wins (set by UnifiedSchedulerApplication
# before any context starts); this line is a no-op in the unified JVM but
# is kept for clarity and standalone-mode compatibility.
logging.config=classpath:log4j2-spring.xml
