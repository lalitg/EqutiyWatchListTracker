# Application name — used in logs, metrics, and health endpoints
spring.application.name=nse-events-scheduler

# Server — different port from nse-news-scheduler (8084)
server.port=8085

# Database — same watchlisttracker DB
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP connection pool — explicit settings prevent silent defaults in production
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA — Hibernate creates the table on first startup if it doesn't exist.
# No Flyway — same approach as auth-service and user-service.
# Reference SQL: scripts/create_company_events_table.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson — readable date strings not numeric timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# NSE Events Scheduler — runs every 20 minutes, all 7 days
events.nse.cron=0 */20 * * * ?

# HTTP read timeout for NSE API calls (seconds)
events.nse.timeout.seconds=10

# How many events to keep per company
events.limit=10

# Tell Spring Boot to use our logback-spring.xml config
logging.config=classpath:log4j2-spring.xml
