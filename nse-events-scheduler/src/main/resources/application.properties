# Server — different port from nse-news-scheduler (8084)
server.port=8085

# Database — same watchlisttracker DB
spring.datasource.url=jdbc:postgresql://localhost:5432/watchlisttracker
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA — Flyway handles schema, Hibernate does nothing to it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson — readable date strings not numeric timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_events
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.repair-on-migrate=true

# NSE Events Scheduler — runs once a day at 7 AM
# Different from news scheduler (8 AM) so they don't overlap
events.nse.cron=0 0 7 * * ?

# How many events to keep per company
events.limit=10

# Tell Spring Boot to use our logback-spring.xml config
logging.config=classpath:logback-spring.xml
