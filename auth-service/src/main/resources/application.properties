# ───── Server ────────────────────────────────────────────────────────────────
server.port=8088
spring.application.name=auth-service

# ───── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ───── JPA / Hibernate ───────────────────────────────────────────────────────
# update: Hibernate creates the table if it doesn't exist.
# The SQL script in scripts/create_refresh_tokens_table.sql is the reference.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ───── JWT ────────────────────────────────────────────────────────────────────
# auth-service SIGNS tokens with this secret.
# user-service and watchlist-service VERIFY with the same secret.
# Must match the JWT_SECRET env var on all services in production.
auth.jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars}

# Access token TTL: 15 minutes (900 seconds)
auth.jwt.access-expiry-seconds=900

# Refresh token TTL: 30 days
auth.jwt.refresh-expiry-days=30

# ───── Session idle timeout ───────────────────────────────────────────────────
# If a refresh token has not been used for this many minutes, treat it as expired.
# Matches the 30-minute frontend idle timer so both layers agree.
auth.refresh-token.idle-timeout-minutes=30

# ───── User Service ───────────────────────────────────────────────────────────
# URL of user-service for the internal /validate call during login
auth.user-service.url=${USER_SERVICE_URL:http://localhost:8087}

# Shared secret sent as X-Internal-Api-Key when calling user-service
auth.internal.api-key=${INTERNAL_API_KEY:internal-dev-key}

# ───── Forgot Password ───────────────────────────────────────────────────────
# How long (in minutes) a password reset token stays valid before expiring.
auth.forgot-password.expiry-minutes=15

# Return the raw reset token in the /forgot-password response.
# PRODUCTION-SAFE DEFAULT = false — the token is emailed, never returned to the browser.
# Set to true ONLY for local development/testing when no SMTP server is configured.
auth.forgot-password.return-token-in-response=${AUTH_RETURN_RESET_TOKEN:false}

# ───── Email (AWS SES SMTP) ──────────────────────────────────────────────────
# Host defaults to the SES Mumbai endpoint so the JavaMailSender bean is always
# created (app starts even when credentials are absent). Username/password come
# from env vars (SES SMTP credentials) and are blank locally — sends then fail
# and are logged, never crashing the request.
spring.mail.host=${SES_SMTP_HOST:email-smtp.ap-south-1.amazonaws.com}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME:}
spring.mail.password=${SES_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender address — must be on a domain verified in AWS SES (no mailbox needed).
app.email.from=${APP_EMAIL_FROM:noreply@niveshflow.com}

# Base URL of the frontend reset-password page. The reset link is this + "?token=<raw>".
app.email.reset-password-url=${APP_RESET_PASSWORD_URL:https://niveshflow.com/reset-password}

# ───── Logging ───────────────────────────────────────────────────────────────
# Configured via log4j2.xml — see src/main/resources/log4j2.xml
logging.config=classpath:log4j2.xml
