# ───── Server ────────────────────────────────────────────────────────────────
server.port=8089
spring.application.name=payment-service

# ───── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ───── JPA / Hibernate ───────────────────────────────────────────────────────
# update: Hibernate creates tables if missing. SQL script in scripts/ is the reference.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ───── JWT (verification only — payment-service never signs tokens) ───────────
# Must match the JWT_SECRET set in auth-service and user-service.
auth.jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars}

# ───── Internal service-to-service API key ───────────────────────────────────
# watchlist-service sends this header when asking what a user is entitled to while enforcing
# watchlist limits and alert access. Must match auth.internal.api-key on the calling service.
# The default is a development value - override INTERNAL_API_KEY in production.
auth.internal.api-key=${INTERNAL_API_KEY:internal-dev-key}

# ───── Entitlements ──────────────────────────────────────────────────────────
# The kill switch. false grants every user the ADVANCED tier, so a problem with billing
# unlocks the product instead of locking paying customers out of what they bought.
# Set BILLING_ENABLED=false on the server to switch all paywalls off without a deployment.
billing.enabled=${BILLING_ENABLED:true}

# ───── Razorpay ───────────────────────────────────────────────────────────────
# Use test keys during development: rzp_test_XXXXXXXXXX
# Switch to live keys on AWS: rzp_live_XXXXXXXXXX
# NEVER hardcode these — always use env vars.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# ───── Scheduled Jobs ────────────────────────────────────────────────────────
# Nightly job at midnight: expire subscriptions whose period has ended
subscription.expiry.cron=0 0 0 * * *

# ───── Logging ───────────────────────────────────────────────────────────────
# Configured via log4j2.xml — see src/main/resources/log4j2.xml
logging.config=classpath:log4j2.xml
