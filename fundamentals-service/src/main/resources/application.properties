# ───── Application ────────────────────────────────────────────────────────────
spring.application.name=fundamentals-service

# Each service in the unified-scheduler gets a unique port
server.port=8086

# ───── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP — same conservative settings as other services in this project
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ───── JPA / Hibernate ───────────────────────────────────────────────────────
# ddl-auto=update: Hibernate creates tables on first startup if they don't exist.
# No Flyway — same approach as auth-service and user-service.
# Reference SQL: scripts/create_fundamentals_tables.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ───── Jackson ────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ───── yfinance Python wrapper ────────────────────────────────────────────────
# yfinance_wrapper.py runs as a short-lived child process per fetch — NOT a
# persistent server (see PythonProcessRunner / YFinanceWrapperClient for why: the
# old always-on Flask wrapper was a repeated contributor to EC2 OOM kills, given
# how much this service fetches across 2000+ companies).
# python.executable: the venv's Python interpreter. Local dev default assumes
#   "python" is on PATH; EC2 overrides via PYTHON_EXECUTABLE=/opt/niveshflow/venv/bin/python.
# python.fundamentals.script: path to the script. Local dev default is relative to
#   this module's working directory; EC2 overrides via PYTHON_FUNDAMENTALS_SCRIPT.
python.executable=${PYTHON_EXECUTABLE:python}
python.fundamentals.script=${PYTHON_FUNDAMENTALS_SCRIPT:yfinance_wrapper.py}
# Generous timeout — a chunk of fundamentals.python.chunk-size symbols, paced by
# fundamentals.rate-limit.delay-ms, can legitimately take several minutes.
python.process.timeout-seconds=${PYTHON_PROCESS_TIMEOUT_SECONDS:1200}

# Max symbols per yfinance_wrapper.py invocation. Bounds how long a single Python
# process runs and how much of a fetch is lost if one chunk fails — NOT one process
# for the whole global_watchlist (2000+ symbols) or one process per symbol.
fundamentals.python.chunk-size=${FUNDAMENTALS_CHUNK_SIZE:200}

# ───── Scheduler cron expressions ─────────────────────────────────────────────
# Nightly quarterly fetch — runs at 11 PM every day
# Only actually fetches during results season (checked inside the job)
fundamentals.quarterly.cron=0 0 23 * * *

# Weekly off-season sync — every Sunday at 2 AM
fundamentals.weekly-sync.cron=0 0 2 * * SUN

# Monthly balance sheet fetch — 1st of every month at 3 AM
fundamentals.balance-sheet.cron=0 0 3 1 * *

# ───── Rate limiter ───────────────────────────────────────────────────────────
# Sleep between companies to avoid hitting yfinance/Yahoo rate limits. Applied
# INSIDE yfinance_wrapper.py, between symbols within a chunk (see YFinanceWrapperClient
# — this same property drives Python's --delay-seconds argument, one source of truth).
# 1500ms × number of companies in global_watchlist per full run.
# DO NOT set below 1000ms or you risk Yahoo rate-limiting/blocking requests.
fundamentals.rate-limit.delay-ms=1500

# ───── Daily P/E snapshot ─────────────────────────────────────────────────────
# Runs Mon–Fri at 4:30 PM IST (1 hour after NSE closes at 3:30 PM).
# Cron is in server local time (IST). Change to UTC equivalent if deploying on UTC server:
#   UTC equivalent: 0 0 11 * * MON-FRI  (IST = UTC+5:30, so 16:30 IST = 11:00 UTC)
fundamentals.pe-snapshot.cron=0 30 16 * * MON-FRI

# ───── New-company detection poll ────────────────────────────────────────────
# How often (ms) to poll global_watchlist for newly added companies.
# Default: 300000 = 5 minutes. Runs as fixedDelay (waits after prev run finishes).
fundamentals.new-company-poll.delay-ms=300000

# ───── Thread pool ────────────────────────────────────────────────────────────
# Keep small — t3.micro has 1 GB RAM shared across 6 Spring Boot contexts
spring.task.scheduling.pool.size=2

# ───── Logging ────────────────────────────────────────────────────────────────
logging.config=classpath:log4j2-spring.xml
