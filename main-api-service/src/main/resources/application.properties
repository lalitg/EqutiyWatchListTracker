# ═══════════════════════════════════════════════════════════════════════════════
#  main-api-service — combined JVM for watchlist-service + user-service + auth-service
#  Single port 8080.  Replaces the three standalone services.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=main-api-service

# ── PostgreSQL ────────────────────────────────────────────────────────────────
# Shared DB for all three services (users, refresh_tokens, watchlist, company_master)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update: creates/alters tables for all three services' entities on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# Single shared secret — used by auth-service to SIGN tokens and by
# user-service + watchlist-service to VERIFY them.
# Override with a strong random value via JWT_SECRET env var in production.
auth.jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars}

# Access token TTL: 15 minutes
auth.jwt.access-expiry-seconds=900

# Refresh token TTL: 30 days
auth.jwt.refresh-expiry-days=30

# ── Internal service-to-service API key ───────────────────────────────────────
# auth-service sends this header when calling POST /api/v1/internal/users/validate.
# InternalUserController checks it before returning the password hash.
auth.internal.api-key=${INTERNAL_API_KEY:internal-dev-key}

# ── Self-loop URLs (auth-service → user-service, ProxyController → auth/user) ─
#
# All three services now run on the SAME JVM at port 8080.
# UserServiceClient (auth-service code) still uses RestTemplate to call user-service.
# ProxyController (watchlist-service code) still uses RestTemplate to proxy
# /api/auth/** and /api/user/** requests.
#
# Setting both targets to localhost:8080 makes them loop back to this same JVM.
# The receiving controllers (UserController, AuthController) handle the request
# normally.  Overhead is one localhost TCP round-trip (~0.1 ms) — acceptable.
#
auth.user-service.url=${USER_SERVICE_URL:http://localhost:8080}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8080}
user.service.url=${USER_SERVICE_URL:http://localhost:8080}

# ── External JVM 2 service URLs ───────────────────────────────────────────────
# These services remain in JVM 2 (unified-scheduler.jar).
# ProxyController in watchlist-service forwards the matching paths to them.
global.watchlist.service.url=${GLOBAL_WATCHLIST_URL:http://localhost:8083}
news.service.url=${NEWS_SERVICE_URL:http://localhost:8084}
events.service.url=${EVENTS_SERVICE_URL:http://localhost:8085}
fast.movers.service.url=${FAST_MOVERS_URL:http://localhost:8081}
fundamentals.service.url=${FUNDAMENTALS_URL:http://localhost:8086}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Allowed origins for the React frontend.
# Override via CORS_ALLOWED_ORIGINS env var on EC2 (comma-separated).
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://niveshflow.com,https://niveshflow.com,http://www.niveshflow.com,https://www.niveshflow.com}

# ── Logging ───────────────────────────────────────────────────────────────────
# Configured via log4j2.xml — see src/main/resources/log4j2.xml
logging.config=classpath:log4j2.xml
