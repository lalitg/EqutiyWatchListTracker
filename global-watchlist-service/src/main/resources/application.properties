# Server
server.port=8083

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application
spring.application.name=global-watchlist-service

# yfinance wrapper — dedicated instance for global indices, port 5002
# (separate from fundamentals-service's own wrapper on port 5001)
yfinance.wrapper.base-url=http://localhost:5002

# Logging — configured via log4j2.xml
logging.config=classpath:log4j2.xml
