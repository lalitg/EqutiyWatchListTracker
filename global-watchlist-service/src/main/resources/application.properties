# Server
server.port=8083

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application
spring.application.name=global-watchlist-service

# yfinance global-indices fetch — run on demand as a short-lived child process, NOT a
# persistent server (see PythonProcessRunner / yfinance_wrapper.py for why: the old
# always-on Flask wrapper was a repeated contributor to EC2 OOM kills).
# python.executable: the venv's Python interpreter. Local dev default assumes "python"
#   is on PATH; EC2 overrides via PYTHON_EXECUTABLE=/opt/niveshflow/venv/bin/python.
# python.global-indices.script: path to the script. Local dev default is relative to
#   this module's working directory; EC2 overrides via PYTHON_GLOBAL_SCRIPT to wherever
#   the file is deployed (e.g. /opt/niveshflow/yfinance_global.py).
python.executable=${PYTHON_EXECUTABLE:python}
python.global-indices.script=${PYTHON_GLOBAL_SCRIPT:yfinance_wrapper.py}
python.process.timeout-seconds=${PYTHON_PROCESS_TIMEOUT_SECONDS:60}

# Logging — configured via log4j2.xml
logging.config=classpath:log4j2.xml
