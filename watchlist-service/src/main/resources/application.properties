# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlistTracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application
spring.application.name=watchlist-service

# External services
global.watchlist.service.url=http://localhost:8083

# Logging — configured via log4j2.xml
logging.config=classpath:log4j2.xml
