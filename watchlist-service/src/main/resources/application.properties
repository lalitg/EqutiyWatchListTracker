# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application
spring.application.name=watchlist-service

# External services
global.watchlist.service.url=http://localhost:8083
auth.service.url=http://localhost:8088
user.service.url=http://localhost:8087
news.service.url=http://localhost:8084
events.service.url=http://localhost:8085
fast.movers.service.url=http://localhost:8081
fundamentals.service.url=http://localhost:8086
nse.code.service.url=http://localhost:8082

# Billing. Standalone this is payment-service on its own port; inside main-api-service both run in
# the same JVM and this points back at localhost:8080, the same loopback auth uses for user-service.
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8089}

# Shared secret for the internal entitlements lookup. Must match auth.internal.api-key in
# payment-service, and be overridden in production.
auth.internal.api-key=${INTERNAL_API_KEY:internal-dev-key}

# JWT — same secret as auth-service and user-service
# Override with JWT_SECRET env var in production
auth.jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars}

# Signs the unsubscribe links in alert emails. The news service signs with the same value, so the
# two must match exactly or every unsubscribe link breaks. Empty here means links cannot be signed
# or honoured at all, which is the safe state for a server that is not sending alerts.
alert.unsubscribe.secret=${ALERT_UNSUBSCRIBE_SECRET:}

# CORS — allowed origins for the frontend (comma-separated)
# Override via environment variable CORS_ALLOWED_ORIGINS on AWS
cors.allowed.origins=http://localhost:3000,http://niveshflow.com,https://niveshflow.com,http://www.niveshflow.com,https://www.niveshflow.com

# CORS — allowed origins for the frontend (comma-separated)
# Override via environment variable CORS_ALLOWED_ORIGINS on AWS
cors.allowed.origins=http://localhost:3000,http://niveshflow.com,https://niveshflow.com,http://www.niveshflow.com,https://www.niveshflow.com

# Logging — configured via log4j2.xml
logging.config=classpath:log4j2.xml
