# ───── Server ────────────────────────────────────────────────────────────────
server.port=8087
spring.application.name=user-service

# ───── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ───── JPA / Hibernate ───────────────────────────────────────────────────────
# update: Hibernate creates the table if it doesn't exist, or adds missing columns.
# The SQL script in scripts/create_users_table.sql is the reference for the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ───── JWT (shared secret with auth-service) ─────────────────────────────────
# auth-service signs tokens with this secret; user-service verifies them.
# Override with a strong random value via environment variable in production.
auth.jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars}

# ───── Internal service-to-service API key ────────────────────────────────────
# auth-service sends this in X-Internal-Api-Key header when calling
# POST /api/v1/internal/users/validate
auth.internal.api-key=${INTERNAL_API_KEY:internal-dev-key}

# ───── Email ──────────────────────────────────────────────────────────
# OFF by default. A developer has no SMTP credentials, and every flow that sends mail
# must still be walkable locally — with this false the message, link and all, is written
# to the log instead of being sent. Production sets MAIL_ENABLED=true.
# Names match auth-service, which already sends password-reset mail through SES — one set of
# credentials and one switch for the whole product, not a second convention.
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:noreply@niveshflow.com}
app.email.from-name=${APP_EMAIL_FROM_NAME:NiveshFlow}

# Amazon SES SMTP. Port 587 with STARTTLS, never 25 — EC2 blocks outbound 25.
spring.mail.host=${SES_SMTP_HOST:email-smtp.ap-south-1.amazonaws.com}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME:}
spring.mail.password=${SES_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Without these three a hung mail server holds the request thread indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ───── Email verification ─────────────────────────────────────────────────
# Where the emailed link points — the site the user browses, not this service.
app.email.verify-url=${APP_VERIFY_URL:http://localhost:3000/verify-email}
user.email-verification.ttl-hours=${VERIFICATION_TTL_HOURS:24}
user.email-verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN:120}

# Bounce and complaint feedback from SES, delivered by SNS to
#   POST /api/v1/internal/ses/notifications?key=${SES_SNS_SECRET}
# SNS cannot send custom headers, so the secret travels in the subscription URL. Empty by default:
# an unconfigured server refuses every notification rather than trusting anonymous callers.
app.email.sns.secret=${SES_SNS_SECRET:}
app.email.sns.topic-arn=${SES_SNS_TOPIC_ARN:}

# ───── Logging ───────────────────────────────────────────────────────────────
# Configured via log4j2.xml — see src/main/resources/log4j2.xml
logging.config=classpath:log4j2.xml
