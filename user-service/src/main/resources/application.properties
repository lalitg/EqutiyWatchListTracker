# ───── Server ────────────────────────────────────────────────────────────────
server.port=8087
spring.application.name=user-service

# ───── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:watchlisttracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ───── JPA / Hibernate ───────────────────────────────────────────────────────
# update: Hibernate creates the table if it doesn't exist, or adds missing columns.
# The SQL script in scripts/create_users_table.sql is the reference for the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ───── JWT (shared secret with auth-service) ─────────────────────────────────
# auth-service signs tokens with this secret; user-service verifies them.
# Override with a strong random value via environment variable in production.
auth.jwt.secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars}

# ───── Internal service-to-service API key ────────────────────────────────────
# auth-service sends this in X-Internal-Api-Key header when calling
# POST /api/v1/internal/users/validate
auth.internal.api-key=${INTERNAL_API_KEY:internal-dev-key}

# ───── Logging ───────────────────────────────────────────────────────────────
# Configured via log4j2.xml — see src/main/resources/log4j2.xml
logging.config=classpath:log4j2.xml
